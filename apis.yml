name: Bodyport
description: >-
  Bodyport is a San Francisco healthcare technology company delivering remote
  heart-failure monitoring. Its FDA-cleared Cardiac Scale captures hemodynamic
  biomarkers through a patient's feet in under 30 seconds and transmits the
  readings over cellular to care teams within minutes. The company's Congestion
  Index algorithm combines multiple hemodynamic biomarkers to detect worsening
  heart failure earlier than standard weight-based rules, and its connected Care
  Platform surfaces monitoring, alerts, and care coordination through a clinical
  dashboard and a patient portal. Bodyport works with health systems and pharma
  partners including Geisinger, Boehringer Ingelheim, Stanford, Brigham and
  Women's Hospital, Duke, and Yale. The company publishes no public developer
  API; this profile captures its product, portal, and compliance surfaces.
